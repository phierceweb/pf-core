name: guards
on: [push, pull_request]
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # [dev] is the single source of truth for the ruff version — a pinned
      # duplicate here drifts from pyproject.
      - run: pip install -e ".[dev]"
      - name: file-size gate
        run: python -m pf_core.guards
      - name: ruff lint
        run: ruff check src tests
      - name: ruff format
        run: ruff format --check src tests
