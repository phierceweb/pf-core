# pf-core build gates. Run `pre-commit install` once per clone (from the project
# venv) so these run on every commit. CI (.github/workflows/guards.yml) is the
# unskippable backstop. See docs/guards.md.
repos:
  - repo: local
    hooks:
      - id: pf-guards-file-size
        name: pf-core file-size gate
        entry: .venv/bin/python -m pf_core.guards
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: docs-gates
        name: docs pins + version-reference gate
        entry: .venv/bin/pytest tests/test_docs_pins.py -q
        language: system
        pass_filenames: false
        always_run: true
      # The gate script is gitignored (it names private consumers), so it is
      # absent in a public clone — skip rather than fail there.
      - id: fingerprints
        name: fingerprint gate
        entry: bash -c 'if [ -f .ai/scripts/check-fingerprints.sh ]; then bash .ai/scripts/check-fingerprints.sh; else echo "fingerprint gate not present - skipped"; fi'
        language: system
        pass_filenames: false
        always_run: true
